name: Reset full tests trigger

on:
  pull_request_target:
    branches:
      - main
    types:
      - labeled

jobs:
  reset-trigger:
    name: Сбросить команду запуска
    if: github.event.label.name == 'run-full-tests'
    permissions:
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Снять метку запуска
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api --method DELETE "repos/$GH_REPO/issues/$PR_NUMBER/labels/run-full-tests"
